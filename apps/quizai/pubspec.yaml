name: quizai
description: "QuizAI: aplicación con la modalidad Quiz10."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  ai_apps_ai:
    path: ../../ai/flutter_client
  ai_apps_identity:
    path: ../../shared/identity
  ai_apps_ui:
    path: ../../shared/ui
  flutter:
    sdk: flutter
  file_picker: ^10.3.10
  archive: 4.3.0
  google_mlkit_text_recognition: 0.15.0
  path_provider: 2.1.5
  pdfrx: 2.6.5
  xml: 7.0.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  ai_apps_service:
    path: ../../ai/dart_service
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/home/
    - assets/auth/
    - assets/quiz10/loading/
    - assets/fonts/OFL.txt

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
